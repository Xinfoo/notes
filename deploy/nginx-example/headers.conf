# 这个文件可以放在 /etc/nginx/snippets 下
# 强制 HTTPS 连接
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
# HTTP/3尝试
add_header Alt-Svc 'h3=":443"; ma=86400' always;
# 禁止任何外站内容内嵌
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
# 禁止 MIME 嗅探
add_header X-Content-Type-Options "nosniff" always;
# Referrer 策略
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 限制 inframe 权限
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
